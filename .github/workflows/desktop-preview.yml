name: Experimental desktop pair

on:
  push:
    branches: [main]
    paths:
      - ".gitattributes"
      - "VERSION"
      - "LICENSE"
      - "NOTICE"
      - "LICENSE-GUIDE.md"
      - "apps/game/**"
      - "native/core/**"
      - "CMakeLists.txt"
      - "spikes/portable-core/**"
      - "native/macos/**"
      - "native/assets/BigRusty/**"
      - "scripts/*game*.py"
      - "scripts/fetch-godot.py"
      - "scripts/sign-macos-release.py"
      - "scripts/build-version.py"
      - "scripts/update-release-readme.py"
      - "scripts/build-macos-lab.sh"
      - "scripts/test-tempo-adapter.sh"
      - "scripts/test-settings-controls.sh"
      - "scripts/test-song-player.sh"
      - "scripts/import_song.py"
      - "scripts/fetch-samples.py"
      - "scripts/distribution/**"
      - "scripts/tests/**"
      - ".github/workflows/desktop-preview.yml"
  pull_request:
    paths:
      - ".gitattributes"
      - "VERSION"
      - "LICENSE"
      - "NOTICE"
      - "LICENSE-GUIDE.md"
      - "apps/game/**"
      - "native/core/**"
      - "CMakeLists.txt"
      - "spikes/portable-core/**"
      - "native/macos/**"
      - "native/assets/BigRusty/**"
      - "scripts/*game*.py"
      - "scripts/fetch-godot.py"
      - "scripts/sign-macos-release.py"
      - "scripts/build-version.py"
      - "scripts/update-release-readme.py"
      - "scripts/build-macos-lab.sh"
      - "scripts/test-tempo-adapter.sh"
      - "scripts/test-settings-controls.sh"
      - "scripts/test-song-player.sh"
      - "scripts/import_song.py"
      - "scripts/fetch-samples.py"
      - "scripts/distribution/**"
      - "scripts/tests/**"
      - ".github/workflows/desktop-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-preview-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and test ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
            cmake_args: -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          - os: windows-2025
            target: windows-x86_64
            cmake_args: -A x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record numbered build identity
        run: python3 scripts/build-version.py
      - name: Validate shared course and original sample bank
        run: python3 scripts/verify-game-content.py
      - name: Check packaging, content, and paired artifact validation
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Test native Swift history recovery and tempo adapter (Foundation only)
        if: runner.os == 'macOS'
        run: |
          mkdir -p .build
          bash scripts/test-tempo-adapter.sh 2>&1 | tee .build/tempo-adapter.log
      - name: Check native settings controls without showing a window
        if: runner.os == 'macOS'
        run: bash scripts/test-settings-controls.sh 2>&1 | tee .build/settings-controls.log
      - name: Check native song playback contracts
        if: runner.os == 'macOS'
        run: bash scripts/test-song-player.sh 2>&1 | tee .build/song-player.log
      - name: Compile native Mac app without launching
        if: runner.os == 'macOS'
        run: bash scripts/build-macos-lab.sh 2>&1 | tee .build/native-macos-build.log
      - name: Compare shared course with authored Swift lessons
        if: runner.os == 'macOS'
        run: |
          mkdir -p .build
          swiftc native/macos/DrumxCourse.swift apps/game/tools/export-course.swift -o .build/export-game-course
          .build/export-game-course > .build/native-course-verified.json
          python3 scripts/verify-game-content.py --native-course .build/native-course-verified.json
      - name: Compare shared visual baseline with the original Swift projection
        if: runner.os == 'macOS'
        run: |
          mkdir -p .build
          swiftc native/macos/DrumxProjection.swift apps/game/tools/export-visual-baseline.swift -o .build/export-visual-baseline
          .build/export-visual-baseline > .build/native-visual-baseline-verified.json
          python3 scripts/verify-game-content.py --native-visual-baseline .build/native-visual-baseline-verified.json
      - name: Fetch pinned editor and export templates
        run: python3 scripts/fetch-godot.py
      - name: Build and test portable scoring and C interface contracts
        run: |
          cmake -S . -B .build/portable -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build .build/portable --config Release --parallel 3
          ctest --test-dir .build/portable -C Release --output-on-failure
      - name: Configure native audio, MIDI, and scoring extension
        run: cmake -S apps/game/native -B .build/game-native -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}
      - name: Build native extension and contracts
        run: cmake --build .build/game-native --config Release --parallel 3
      - name: Test native backend
        run: ctest --test-dir .build/game-native -C Release --output-on-failure
      - name: Export and execute packaged app smoke test
        env:
          # Secrets are only exposed to the authorized main-repository Mac build.
          MACOS_SIGNING_ENABLED: ${{ runner.os == 'macOS' && github.repository == 'claudfuen/drumx' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.MACOS_SIGNING_ENABLED == 'true' && 'true' || 'false' }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ runner.os == 'macOS' && github.repository == 'claudfuen/drumx' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.MACOS_CERTIFICATE_P12_BASE64 || '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && github.repository == 'claudfuen/drumx' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          MACOS_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && github.repository == 'claudfuen/drumx' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.MACOS_SIGNING_IDENTITY || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && github.repository == 'claudfuen/drumx' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.APPLE_TEAM_ID || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && github.repository == 'claudfuen/drumx' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && github.repository == 'claudfuen/drumx' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
        run: python3 scripts/package-game.py --target "${{ matrix.target }}"
      - name: Retain verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: experimental-app-${{ matrix.target }}
          path: |
            .build/preview/Drumx-${{ matrix.target }}.zip
            .build/preview/${{ matrix.target }}.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Retain build and smoke logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-${{ matrix.target }}
          path: |
            .build/game-export/${{ matrix.target }}/logs
            .build/game-native/Testing/Temporary/LastTest.log
            .build/portable/Testing/Temporary/LastTest.log
            .build/tempo-adapter.log
            .build/settings-controls.log
            .build/song-player.log
            .build/native-macos-build.log
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  verify_pair:
    name: Verify experimental pair
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: experimental-app-*
          path: .build/preview
          merge-multiple: true
      - name: Verify same-commit packages without publishing
        run: python3 scripts/publish-game-preview.py --commit "$GITHUB_SHA" --verify-only
      - name: Retain paired manifest and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: experimental-pair-manifest
          path: |
            .build/preview/build-manifest.json
            .build/preview/SHA256SUMS.txt
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  publish_preview:
    name: Publish versioned experimental prerelease
    needs: [build, verify_pair]
    if: github.repository == 'claudfuen/drumx' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: experimental-app-*
          path: .build/preview
          merge-multiple: true
      - name: Reverify exact pair and publish numbered immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-game-preview.py --commit "$GITHUB_SHA"
      - name: Update README downloads to the verified numbered release
        env:
          GH_TOKEN: ${{ github.token }}
        # Only the marked README region changes. README is outside build paths,
        # and commits made with GITHUB_TOKEN do not recursively start workflows.
        run: python3 scripts/update-release-readme.py --commit "$GITHUB_SHA"
